<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="HabitFlow helps you build consistency, one day at a time.">
  <title>HabitFlow — Track progress, not perfection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page-link="dashboard" aria-label="HabitFlow home">
        <span class="brand-mark"><i data-lucide="orbit"></i></span>
        <span>habit<span class="brand-light">flow</span></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
        <button class="nav-link" data-page="habits"><i data-lucide="list-checks"></i><span>My habits</span></button>
        <button class="nav-link" data-page="goals"><i data-lucide="target"></i><span>Weekly goals</span></button>
        <button class="nav-link" data-page="calendar"><i data-lucide="calendar-days"></i><span>Calendar &amp; history</span></button>
        <button class="nav-link" data-page="analytics"><i data-lucide="chart-no-axes-column-increasing"></i><span>Analytics</span></button>
        <button class="nav-link" data-page="review"><i data-lucide="notebook-pen"></i><span>Weekly review</span></button>
      </nav>
      <div class="side-bottom">
        <button class="nav-link" data-page="settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
        <div class="sidebar-note">
          <span class="note-icon"><i data-lucide="sparkles"></i></span>
          <p>Small steps add up.<br><strong>Keep showing up.</strong></p>
        </div>
        <div class="profile-row"><span class="avatar">H</span><span><strong>Your space</strong><small>Personal workspace</small></span><i data-lucide="more-horizontal"></i></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuToggle" aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
        <div class="breadcrumb"><span>Workspace</span><i data-lucide="chevron-right"></i><strong id="pageCrumb">Dashboard</strong></div>
        <div class="top-actions">
          <span class="today-label" id="todayLabel"></span>
          <button class="icon-button theme-toggle" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
          <button class="button button-primary top-add" id="topAddHabit"><i data-lucide="plus"></i><span>New habit</span></button>
        </div>
      </header>
      <div class="page-content" id="pageContent" aria-live="polite"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
